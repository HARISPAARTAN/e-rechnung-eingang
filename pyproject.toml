[project]
name = "erechnung"
version = "0.2.0"
description = "E-Rechnung-Eingang: Prüfdienst für XRechnung und ZUGFeRD mit dem KoSIT-Validator, Feldextraktion und Archivnamen."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Harithas Harikaran" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.20",
  "httpx>=0.28",
  "lxml>=5.3",
  "pikepdf>=9.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.9",
    "factur-x>=3.0",
    "reportlab>=4.2",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erechnung"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["validator: needs a running KoSIT validator daemon (ERE_VALIDATOR_URL or java)"]
addopts = "-m 'not validator'"
filterwarnings = [
  # starlette 1.x prefers httpx2 for its TestClient; httpx works, the notice is not ours
  'ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning',
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

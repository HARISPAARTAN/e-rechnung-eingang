name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run pytest tests/unit tests/api -q

  validator:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: uv sync --dev
      - run: uv run python tools/get_validator.py
      - run: uv run pytest tests/validator -m validator -q

  image:
    runs-on: ubuntu-24.04
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t erechnung-eingang:ci .
      - run: |
          docker run -d --name ere -p 8080:8080 erechnung-eingang:ci
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8080/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8080/health | grep -q '"status":"ok"'
          curl -fs -F "file=@fixtures/xrechnung/01.01a-INVOICE_ubl.xml" http://127.0.0.1:8080/validate | grep -q '"gueltig":true'
          docker logs ere --tail 20
          docker rm -f ere

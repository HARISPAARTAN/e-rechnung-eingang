name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  image:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/harispaartan/e-rechnung-eingang:${{ github.ref_name }}
            ghcr.io/harispaartan/e-rechnung-eingang:latest
  # Needs the GitHub environment "production" with AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID and
  # ERE_API_KEY (see deploy/README.md). Until the owner has created it, this job fails at the Azure login.
  deploy:
    needs: image
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Update container app
        run: |
          az extension add --name containerapp --only-show-errors
          az containerapp update --name ca-erechnung --resource-group rg-erechnung --image "ghcr.io/harispaartan/e-rechnung-eingang:${{ github.ref_name }}" --output none
      - name: Public URL
        id: url
        run: echo "fqdn=$(az containerapp show --name ca-erechnung --resource-group rg-erechnung --query properties.configuration.ingress.fqdn -o tsv)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Smoke test
        env:
          ERE_API_KEY: ${{ secrets.ERE_API_KEY }}
        run: uv run python tools/smoke_remote.py --base-url "https://${{ steps.url.outputs.fqdn }}" --key-env ERE_API_KEY --junit smoke.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke, path: smoke.xml, if-no-files-found: ignore }

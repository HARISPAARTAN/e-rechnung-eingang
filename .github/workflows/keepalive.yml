name: keepalive
# Azure deletes idle Container Apps environments after 90 days. One health call a month prevents that and
# records the cold-start time in the job log. Needs the repository variable ERE_BASE_URL (https://<fqdn>, a trailing slash is tolerated).
on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-24.04
    steps:
      - name: Call /health
        env:
          ERE_BASE_URL: ${{ vars.ERE_BASE_URL }}
        run: |
          if [ -z "${ERE_BASE_URL:-}" ]; then
            echo "::notice::Repository variable ERE_BASE_URL is not set; nothing to ping yet."
            exit 0
          fi
          BASE="${ERE_BASE_URL%/}"
          for attempt in 1 2 3; do
            start=$(date +%s)
            if curl -fsS --max-time 120 "$BASE/health"; then
              echo
              echo "Health OK on attempt $attempt after $(( $(date +%s) - start )) s (cold start included)"
              exit 0
            fi
            echo "Attempt $attempt failed after $(( $(date +%s) - start )) s"
            [ "$attempt" -lt 3 ] && sleep 20
          done
          exit 1
